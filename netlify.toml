# Netlify configuration for Silla Vida

# Build settings
[build]
  # Build command
  command = "npm run build"
  # Directory to publish (output of the build)
  publish = "dist"
  # Node.js version
  environment = { NODE_VERSION = "18" }

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' *.myshopify.com; img-src 'self' data: *.myshopify.com *.shopify.com *.unsplash.com; script-src 'self' 'unsafe-inline' *.myshopify.com; style-src 'self' 'unsafe-inline'; connect-src 'self' *.myshopify.com;"

# Cache control for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache control for HTML and JSON files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
